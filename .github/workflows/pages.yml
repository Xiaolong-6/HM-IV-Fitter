name: Deploy static browser to GitHub Pages

on:
  push:
    branches:
      - "feat/static-browser-standalone"
    paths:
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix frontend --no-audit --no-fund

      - name: Build standalone static site
        run: npm run build:static

      - name: Verify Pages payload
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/browser-runtime.worker.js
          test -f frontend/dist/static-python/manifest.json
          touch frontend/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
