name: Static browser prototype

on:
  push:
    branches:
      - "feat/static-browser-standalone"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/STATIC_BROWSER_PLAN.md"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/static-browser.yml"
  workflow_dispatch:

concurrency:
  group: static-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-browser:
    name: static-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Run Python regression and bridge tests
        env:
          PYTHONPATH: backend
        run: |
          # Main currently contains one stale CSS-ownership test that references
          # model-builder.css/shell.css files already absent from main.
          python -m pytest backend/tests -q -k "not test_css_model_builder_owns_styles_without_legacy_shell"
          python -m compileall -q backend/ivfitter backend/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: |
          # Both lockfiles are already stale on main relative to package.json.
          npm install --no-audit --no-fund
          npm install --prefix frontend --no-audit --no-fund

      - name: Build static browser app
        run: npm run build:static

      - name: Audit static artifacts
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/browser-runtime.worker.js
          test -f frontend/dist/static-python/manifest.json
          test -f frontend/dist/static-python/ivfitter/browser_bridge.py
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("frontend/dist/static-python")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          files = set(manifest["files"])
          required = {
              "ivfitter/browser_bridge.py",
              "ivfitter/core/fitting_engine.py",
              "ivfitter/core/model_spec.py",
              "ivfitter/io/import_trace.py",
          }
          missing = sorted(required - files)
          if missing:
              raise SystemExit(f"Static Python manifest missing required files: {missing}")
          print(f"Static Python payload: {len(files)} Python files")
          PY

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real-browser static smoke
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory frontend/dist > /tmp/ivfitter-static-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          cd frontend
          npx playwright test static-browser.spec.ts --reporter=line --workers=1

      - name: Upload UI review screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hm-iv-fitter-ui-review-${{ github.sha }}
          path: frontend/test-results/four-step-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload tested static site
        uses: actions/upload-artifact@v4
        with:
          name: hm-iv-fitter-static-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  frontend-regression:
    name: frontend-regression
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix frontend --no-audit --no-fund

      - name: Run focused frontend regression tests
        timeout-minutes: 4
        run: |
          # The full legacy Vitest suite currently fails to terminate reliably on
          # main. Keep deterministic pure-model/model-builder coverage here; the
          # static-browser job separately exercises the built UI in Chromium.
          npm --prefix frontend run test -- \
            src/model/__tests__ \
            src/model-builder/__tests__ \
            src/api/__tests__ \
            --reporter=dot
